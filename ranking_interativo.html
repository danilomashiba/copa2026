const metricas = {

    jogadores: {
        goals: "Gols",
        goals_per90: "Gols por 90 min",
        over_performance: "Goals - xG"
    },

    selecoes: {
        gols: "Gols",
        assistencias: "Assistências",
        media_rating: "Rating médio",
        distancia_total_km: "Distância total (km)"
    }

};


function atualizarMetricas() {

    const tipo =
        document.getElementById("tipo").value;

    const select =
        document.getElementById("metrica");

    select.innerHTML = "";

    Object.entries(metricas[tipo]).forEach(
        ([valor, nome]) => {

            const option =
                document.createElement("option");

            option.value = valor;
            option.textContent = nome;

            select.appendChild(option);
        }
    );

    atualizar();
}


function atualizar() {

    const tipo =
        document.getElementById("tipo").value;

    const metrica =
        document.getElementById("metrica").value;

    const quantidade =
        Number(
            document.getElementById("quantidade").value
        );

    let dados;

    if (tipo === "jogadores") {

        dados = jogadores
            .filter(d => d.minutes_played >= 180);

        document.getElementById(
            "coluna_nome"
        ).textContent = "Jogador";

        document.getElementById(
            "coluna_extra"
        ).textContent = "Seleção";

    } else {

        dados = selecoes;

        document.getElementById(
            "coluna_nome"
        ).textContent = "Seleção";

        document.getElementById(
            "coluna_extra"
        ).textContent = "";
    }

    const ranking = [...dados]
        .sort(
            (a, b) => b[metrica] - a[metrica]
        )
        .slice(0, quantidade);

    atualizarTabela(
        ranking,
        tipo,
        metrica
    );

    desenharGrafico(
        ranking,
        tipo,
        metrica
    );
}


function atualizarTabela(
    ranking,
    tipo,
    metrica
) {

    const tbody =
        document.getElementById("ranking");

    tbody.innerHTML = "";

    ranking.forEach(
        (item, i) => {

            const linha =
                document.createElement("tr");

            const nome =
                tipo === "jogadores"
                ? item.player_name
                : item.team;

            const extra =
                tipo === "jogadores"
                ? item.team
                : "";

            linha.innerHTML = `
                <td>${i + 1}</td>
                <td>${nome}</td>
                <td>${extra}</td>
                <td>${item[metrica].toFixed(2)}</td>
            `;

            tbody.appendChild(linha);
        }
    );
}


function desenharGrafico(
    ranking,
    tipo,
    metrica
) {

    const svg =
        document.getElementById("grafico");

    svg.innerHTML = "";

    const largura = 900;
    const alturaBarra = 26;
    const espaco = 8;

    const altura =
        ranking.length *
        (alturaBarra + espaco);

    svg.setAttribute(
        "viewBox",
        `0 0 ${largura} ${altura}`
    );

    const maior =
        Math.max(
            ...ranking.map(
                d => d[metrica]
            )
        );

    ranking.forEach(
        (item, i) => {

            const nome =
                tipo === "jogadores"
                ? item.player_name
                : item.team;

            const larguraBarra =
                (item[metrica] / maior) * 500;

            // Criar nome

            const texto =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            texto.setAttribute("x", 0);

            texto.setAttribute(
                "y",
                i * (alturaBarra + espaco) + 19
            );

            texto.textContent = nome;

            svg.appendChild(texto);

            // Criar barra

            const barra =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );

            barra.setAttribute("x", 230);

            barra.setAttribute(
                "y",
                i * (alturaBarra + espaco)
            );

            barra.setAttribute(
                "width",
                larguraBarra
            );

            barra.setAttribute(
                "height",
                alturaBarra
            );

            barra.setAttribute(
                "rx",
                4
            );

            svg.appendChild(barra);

            // Criar valor

            const valor =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            valor.setAttribute(
                "x",
                240 + larguraBarra
            );

            valor.setAttribute(
                "y",
                i * (alturaBarra + espaco) + 19
            );

            valor.textContent =
                item[metrica].toFixed(2);

            svg.appendChild(valor);

        }
    );
}
